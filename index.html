<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="description" content="LeMatic LX-8 Baking Equipment Inspection App" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#07070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LX-8 Inspect" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="LX-8 Inspect" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <title>LeMatic LX-8 Inspection</title>
  <!-- jsPDF for report generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
    :root {
      /* Apple system blue */
      --primary: #0a84ff;
      --primary-light: #64b5ff;
      --primary-soft: rgba(10, 132, 255, 0.22);
      --primary-top: #409cff;
      --accent: #f59e0b;
      --success: #34d399;
      --danger: #f87171;
      --warning: #fbbf24;
      /* Liquid Glass base */
      --bg: #07070a;
      --surface: rgba(28, 28, 35, 0.55);
      --card: rgba(255, 255, 255, 0.06);
      --elevated: rgba(255, 255, 255, 0.09);
      --glass: rgba(255, 255, 255, 0.08);
      --glass-strong: rgba(255, 255, 255, 0.12);
      --text: #f5f5f7;
      --muted: #98989f;
      --border: rgba(255, 255, 255, 0.12);
      --border-strong: rgba(255, 255, 255, 0.18);
      --border-shine: rgba(255, 255, 255, 0.28);
      --input-bg: rgba(0, 0, 0, 0.35);
      --safe-top: env(safe-area-inset-top);
      --safe-bottom: env(safe-area-inset-bottom);
      --radius: 20px;
      --radius-sm: 14px;
      --radius-pill: 999px;
      --blur: 24px;
      --blur-strong: 40px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      color-scheme: dark;
      letter-spacing: -0.01em;
    }
    /* Ambient liquid glow behind content */
    body {
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
      background:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(10, 132, 255, 0.18), transparent 50%),
        radial-gradient(ellipse 60% 40% at 90% 10%, rgba(10, 132, 255, 0.1), transparent 45%),
        radial-gradient(ellipse 50% 30% at 50% 100%, rgba(10, 132, 255, 0.06), transparent 40%),
        var(--bg);
      background-attachment: fixed;
    }

    /* Shared glass material */
    .glass {
      background: var(--glass);
      backdrop-filter: blur(var(--blur)) saturate(1.4);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(1.4);
      border: 1px solid var(--border);
      box-shadow:
        inset 0 1px 0 0 var(--border-shine),
        0 8px 32px rgba(0, 0, 0, 0.28);
    }

    /* Header — pure black, lower outline only */
    .app-header {
      position: relative;
      background: #000000;
      color: var(--text);
      padding: 12px 16px;
      display: flex; align-items: center; justify-content: space-between;
      border-bottom: 1px solid var(--border);
      box-shadow: none;
    }
    .app-header h1 { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.02em; }
    .header-logo {
      display: flex; align-items: center; gap: 0;
      flex: 1; justify-content: flex-start;
    }
    .header-logo-img {
      height: 36px;
      width: auto;
      max-width: 220px;
      object-fit: contain;
      background: #fff;
      padding: 4px 10px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .header-btn {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--text);
      width: 40px; height: 40px; border-radius: 50%;
      font-size: 1.1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, box-shadow 0.15s;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }
    .header-btn:active {
      background: rgba(255, 255, 255, 0.16);
    }
    .header-actions {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .search-bar {
      display: none;
      background: rgba(18, 18, 24, 0.5);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
    }
    .search-bar.show { display: block; }
    .search-bar input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 1rem;
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      -webkit-appearance: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .search-bar input:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px var(--primary-soft), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .search-bar input::placeholder { color: var(--muted); }

    /* Screens */
    .screen { display: none; min-height: calc(100vh - 60px); padding-bottom: 88px; }
    .screen.active { display: block; }

    /* Cards — Liquid Glass panels */
    .card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(var(--blur)) saturate(1.35);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(1.35);
      border-radius: var(--radius);
      margin: 12px 16px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow:
        inset 0 1px 0 0 var(--border-shine),
        0 8px 28px rgba(0, 0, 0, 0.25);
    }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 0.75rem; font-weight: 600;
      color: var(--muted); margin-bottom: 8px;
      text-transform: uppercase; letter-spacing: 0.06em;
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; padding: 14px 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 1rem;
      background: rgba(0, 0, 0, 0.32);
      color: var(--text);
      -webkit-appearance: none; appearance: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px var(--primary-soft), inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .form-group input::placeholder, .form-group textarea::placeholder {
      color: #71717a;
    }
    .form-group textarea { min-height: 90px; resize: vertical; }

    /* Buttons — blue retained, glass outline */
    .btn {
      display: block; width: 100%; padding: 15px 18px;
      border: none; border-radius: var(--radius-pill);
      font-size: 1rem; font-weight: 600;
      cursor: pointer; text-align: center;
      letter-spacing: -0.01em;
      transition: transform 0.12s, opacity 0.12s, box-shadow 0.15s;
    }
    .btn:active { transform: scale(0.98); opacity: 0.92; }
    .btn-primary {
      background: linear-gradient(180deg, var(--primary-top) 0%, var(--primary) 100%);
      color: #fff;
      box-shadow:
        0 2px 8px rgba(10, 132, 255, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.28);
    }
    .btn-accent { background: var(--accent); color: #111; }
    .btn-success { background: var(--success); color: #052e1a; }
    .btn-outline {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .btn-outline:active { background: rgba(255, 255, 255, 0.1); }
    .btn-row { display: flex; gap: 10px; margin: 16px; }
    .btn-row .btn { flex: 1; }

    /* Progress */
    .progress-bar-container {
      background: rgba(255,255,255,0.08); height: 4px;
      border-radius: 2px; margin-top: 10px; overflow: hidden;
    }
    .progress-bar {
      height: 100%; background: linear-gradient(90deg, var(--primary), var(--primary-light));
      transition: width 0.3s ease;
      border-radius: 2px;
    }
    .section-progress {
      display: flex; gap: 8px; padding: 12px 14px; overflow-x: auto;
      background: rgba(18, 18, 24, 0.45);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border-bottom: 1px solid var(--border);
      -webkit-overflow-scrolling: touch;
    }
    .section-dot {
      flex-shrink: 0;
      padding: 7px 12px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.06);
      color: var(--muted);
      border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.7rem; font-weight: 600;
      white-space: nowrap;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .section-dot.done {
      background: rgba(52, 211, 153, 0.15);
      color: var(--success);
      border-color: rgba(52, 211, 153, 0.3);
    }
    .section-dot.current {
      background: linear-gradient(180deg, var(--primary-top), var(--primary));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(10, 132, 255, 0.3), inset 0 1px 0 rgba(255,255,255,0.28);
    }
    .section-dot.has-findings { box-shadow: 0 0 0 2px var(--danger); }

    /* Item cards — glass */
    .item-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px) saturate(1.3);
      -webkit-backdrop-filter: blur(20px) saturate(1.3);
      margin: 10px 16px;
      border-radius: var(--radius);
      padding: 18px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--border-strong);
      box-shadow:
        inset 0 1px 0 0 var(--border-shine),
        0 6px 24px rgba(0, 0, 0, 0.2);
    }
    .item-card.answered { border-left-color: var(--success); }
    .item-card.finding { border-left-color: var(--danger); }
    .item-title { font-weight: 600; font-size: 1rem; margin-bottom: 4px; letter-spacing: -0.01em; }
    .item-type {
      font-size: 0.7rem; color: var(--muted); text-transform: uppercase;
      letter-spacing: 0.06em; margin-bottom: 14px;
    }
    .choice-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
      gap: 8px;
    }
    .choice-btn {
      padding: 12px 8px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: rgba(0, 0, 0, 0.28);
      color: var(--text);
      font-size: 0.9rem; font-weight: 500; cursor: pointer;
      text-align: center; transition: all 0.15s;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .choice-btn.selected {
      border-color: transparent;
      background: linear-gradient(180deg, var(--primary-top), var(--primary));
      color: #fff;
      box-shadow: 0 2px 8px rgba(10, 132, 255, 0.28), inset 0 1px 0 rgba(255,255,255,0.28);
    }
    .choice-btn.bad.selected {
      border-color: transparent;
      background: linear-gradient(180deg, #fb9a9a, var(--danger));
      color: #1a0505;
      box-shadow: 0 2px 12px rgba(248, 113, 113, 0.3), inset 0 1px 0 rgba(255,255,255,0.2);
    }
    .choice-btn:active { transform: scale(0.97); }

    /* Finding panel */
    .finding-panel {
      margin-top: 16px; padding-top: 16px;
      border-top: 1px solid var(--border);
      display: none;
    }
    .finding-panel.show { display: block; }
    .impact-tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .impact-tag {
      padding: 8px 14px; border-radius: var(--radius-pill);
      border: 1px solid var(--border); font-size: 0.85rem;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      transition: all 0.15s;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .impact-tag.selected {
      background: linear-gradient(180deg, var(--primary-top), var(--primary));
      color: #fff;
      border-color: transparent;
      box-shadow: 0 2px 8px rgba(10, 132, 255, 0.26), inset 0 1px 0 rgba(255,255,255,0.28);
    }
    .severity-select { margin-top: 8px; }
    .notes-input, .sev-select {
      width: 100%; padding: 12px 14px;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      font-size: 0.95rem;
      background: rgba(0, 0, 0, 0.3);
      color: var(--text);
      -webkit-appearance: none; appearance: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .notes-input { min-height: 80px; resize: vertical; }
    .notes-input:focus, .sev-select:focus {
      outline: none;
      border-color: var(--primary-light);
      box-shadow: 0 0 0 3px var(--primary-soft), inset 0 1px 0 rgba(255,255,255,0.08);
    }

    /* Photo */
    .photo-area {
      margin-top: 12px; padding: 20px;
      border: 1.5px dashed var(--border); border-radius: var(--radius-sm);
      text-align: center; color: var(--muted);
      background: rgba(0, 0, 0, 0.25);
    }
    .photo-area.has-photo { border-style: solid; border-color: var(--success); }
    .photo-preview {
      max-width: 100%; max-height: 180px; border-radius: 12px; margin-top: 8px;
    }
    .photo-btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 18px;
      background: linear-gradient(180deg, var(--primary-top), var(--primary));
      color: #fff;
      border: none; border-radius: var(--radius-pill); font-size: 0.9rem; margin-top: 10px;
      font-weight: 600;
      box-shadow: 0 2px 8px rgba(10, 132, 255, 0.26), inset 0 1px 0 rgba(255,255,255,0.28);
    }

    /* Bottom nav — Liquid Glass dock */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(14, 14, 20, 0.55);
      backdrop-filter: blur(var(--blur-strong)) saturate(1.5);
      -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(1.5);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      padding-bottom: calc(12px + var(--safe-bottom));
      display: flex; gap: 10px; z-index: 90;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.1),
        0 -12px 40px rgba(0,0,0,0.35);
      justify-content: stretch;
      align-items: center;
      min-height: 0;
    }
    .bottom-bar .btn {
      margin: 0;
      padding: 15px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: var(--radius-pill);
      flex: 1;
      width: auto;
      min-width: 0;
    }
    .bottom-bar .btn-outline {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.12);
    }
    .bottom-bar .btn-primary {
      background: linear-gradient(180deg, var(--primary-top), var(--primary));
      color: #fff;
      border: none;
      box-shadow: 0 2px 10px rgba(10, 132, 255, 0.3), inset 0 1px 0 rgba(255,255,255,0.28);
    }
    #btnNextSection { margin-left: 0; }

    /* Home / List screens */
    .hero {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text);
      padding: 24px 20px 18px;
      border-radius: 0 0 var(--radius) var(--radius);
      text-align: center;
      border-bottom: 1px solid var(--border);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
    }
    .hero h2 {
      font-size: 1.35rem; margin-bottom: 6px; font-weight: 650;
      letter-spacing: -0.03em;
    }
    .hero p { color: var(--muted); font-size: 0.9rem; opacity: 1; }
    .stat-row {
      display: flex; gap: 12px; margin: 16px;
    }
    .stat-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(var(--blur)) saturate(1.3);
      -webkit-backdrop-filter: blur(var(--blur)) saturate(1.3);
      border-radius: var(--radius); padding: 16px;
      text-align: center;
      border: 1px solid var(--border);
      box-shadow:
        inset 0 1px 0 var(--border-shine),
        0 6px 20px rgba(0,0,0,0.2);
    }
    .stat-card .num {
      font-size: 1.65rem; font-weight: 700;
      color: var(--primary-light);
      letter-spacing: -0.03em;
    }
    .stat-card .label { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

    .list-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      background: transparent;
    }
    .list-item .list-item-main {
      flex: 1; min-width: 0; cursor: pointer;
    }
    .list-item:active .list-item-main { opacity: 0.75; }
    .list-item .title { font-weight: 600; letter-spacing: -0.01em; }
    .list-item .sub { font-size: 0.85rem; color: var(--muted); margin-top: 3px; }
    .list-item-actions {
      display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    }
    .btn-edit {
      background: rgba(10, 132, 255, 0.12);
      border: 1px solid rgba(10, 132, 255, 0.32);
      color: var(--primary-light);
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-edit:active { background: var(--primary-soft); }
    .badge {
      display: inline-block; padding: 4px 10px; border-radius: var(--radius-pill);
      font-size: 0.7rem; font-weight: 600; letter-spacing: 0.02em;
    }
    .badge-draft {
      background: rgba(255, 255, 255, 0.08);
      color: var(--muted);
      border: 1px solid var(--border);
    }
    .badge-complete {
      background: rgba(52, 211, 153, 0.14);
      color: var(--success);
      border: 1px solid rgba(52, 211, 153, 0.25);
    }
    .badge-findings {
      background: rgba(248, 113, 113, 0.14);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.25);
    }

    /* Summary */
    .summary-section { margin: 12px 16px; }
    .summary-section h3 {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--muted); margin-bottom: 10px; font-weight: 600;
    }
    .finding-summary-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: var(--radius); padding: 16px;
      margin-bottom: 10px;
      border: 1px solid var(--border);
      border-left: 3px solid var(--danger);
      box-shadow:
        inset 0 1px 0 var(--border-shine),
        0 6px 20px rgba(0,0,0,0.2);
    }
    .finding-summary-card .sev {
      font-size: 0.8rem; font-weight: 600; color: var(--danger);
    }

    /* Toast — glass pill */
    .toast {
      position: fixed; bottom: 96px; left: 50%; transform: translateX(-50%);
      background: rgba(28, 28, 36, 0.75);
      backdrop-filter: blur(var(--blur-strong)) saturate(1.4);
      -webkit-backdrop-filter: blur(var(--blur-strong)) saturate(1.4);
      color: var(--text); padding: 12px 22px;
      border-radius: var(--radius-pill); font-size: 0.9rem; z-index: 200;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
      max-width: 90%; text-align: center;
      border: 1px solid var(--border);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 12px 40px rgba(0,0,0,0.45);
    }
    .toast.show { opacity: 1; }

    /* Loading */
    .loading-overlay {
      position: fixed; inset: 0;
      background: rgba(7, 7, 10, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      z-index: 300; font-size: 1.05rem; color: var(--primary-light);
    }

    /* Utilities */
    .text-center { text-align: center; }
    .mt-16 { margin-top: 16px; }
    .mb-8 { margin-bottom: 8px; }
    .hidden { display: none !important; }
    .empty-state {
      text-align: center; padding: 48px 24px; color: var(--muted);
    }
    .empty-state .icon { font-size: 2.5rem; margin-bottom: 12px; opacity: 0.4; }
  </style>
</head>
<body>
  <!-- Header -->

 "inspection_item": "Check Shuttle Motor Cable for Snags", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Check Shuttle Motor Cable for Snags"}, {"item_id": 119, "section_id": 10, "section": "Bagger", "item_order_in_section": 30, "inspection_item": "Shuttle Door Lock", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Shuttle Door Lock"}, {"item_id": 120, "section_id": 10, "section": "Bagger", "item_order_in_section": 31, "inspection_item": "Shuttle Door Strut and Bracket", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Shuttle Door Strut and Bracket"}, {"item_id": 121, "section_id": 10, "section": "Bagger", "item_order_in_section": 32, "inspection_item": "Belt and Belt Tracking", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Belt and Belt Tracking"}, {"item_id": 122, "section_id": 10, "section": "Bagger", "item_order_in_section": 33, "inspection_item": "Shaft Brushes and Bearings", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Shaft Brushes and Bearings"}, {"item_id": 123, "section_id": 10, "section": "Bagger", "item_order_in_section": 34, "inspection_item": "Take Away Brush Coupler", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Take Away Brush Coupler"}, {"item_id": 124, "section_id": 10, "section": "Bagger", "item_order_in_section": 35, "inspection_item": "Rack and Sprockets", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Rack and Sprockets"}, {"item_id": 125, "section_id": 11, "section": "Over Head Paddle Conveyor", "item_order_in_section": 1, "inspection_item": "Paddles", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Paddles"}, {"item_id": 126, "section_id": 11, "section": "Over Head Paddle Conveyor", "item_order_in_section": 2, "inspection_item": "Paddle Arms and Shafts", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Paddle Arms and Shafts"}, {"item_id": 127, "section_id": 11, "section": "Over Head Paddle Conveyor", "item_order_in_section": 3, "inspection_item": "Car Assemblies", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Car Assemblies"}, {"item_id": 128, "section_id": 11, "section": "Over Head Paddle Conveyor", "item_order_in_section": 4, "inspection_item": "Drive Belt Tension", "inspection_type": "Measurement", "choices": "Within Spec|Out of Spec|N/A", "photo_required_if": "Out of Spec", "severity_default": 2, "ai_finding_category": "Drive Belt Tension"}, {"item_id": 129, "section_id": 11, "section": "Over Head Paddle Conveyor", "item_order_in_section": 5, "inspection_item": "Drive Belt for Cracks or Tears", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Drive Belt for Cracks or Tears"}, {"item_id": 130, "section_id": 12, "section": "Tying Conveyor", "item_order_in_section": 1, "inspection_item": "All Shafts and Bearings", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "All Shafts and Bearings"}, {"item_id": 131, "section_id": 12, "section": "Tying Conveyor", "item_order_in_section": 2, "inspection_item": "Chains and Tensioners", "inspection_type": "Measurement", "choices": "Within Spec|Out of Spec|N/A", "photo_required_if": "Out of Spec", "severity_default": 2, "ai_finding_category": "Chains and Tensioners"}, {"item_id": 132, "section_id": 12, "section": "Tying Conveyor", "item_order_in_section": 3, "inspection_item": "Clutch and Prox", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Clutch and Prox"}, {"item_id": 133, "section_id": 12, "section": "Tying Conveyor", "item_order_in_section": 4, "inspection_item": "Take-Away Brush and Flap", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Take Away Brush and Flap"}, {"item_id": 134, "section_id": 12, "section": "Tying Conveyor", "item_order_in_section": 5, "inspection_item": "Condition of Flights", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Condition of Flights"}, {"item_id": 135, "section_id": 12, "section": "Tying Conveyor", "item_order_in_section": 6, "inspection_item": "Check Timing", "inspection_type": "Functional", "choices": "Pass|Fail|N/A", "photo_required_if": "Fail", "severity_default": 2, "ai_finding_category": "Check Timing"}, {"item_id": 136, "section_id": 12, "section": "Tying Conveyor", "item_order_in_section": 7, "inspection_item": "Other:", "inspection_type": "Condition", "choices": "Good|Adjustment|Wear|Damaged|N/A", "photo_required_if": "Damaged", "severity_default": 2, "ai_finding_category": "Other"}], "lists": {"condition": ["Good", "Adjustment", "Wear", "Damaged", "N/A"], "functional": ["Pass", "Fail", "N/A"], "measurement": ["Within Spec", "Out of Spec", "N/A"], "severity": ["1 - Monitor", "2 - Adjustment", "3 - Maintenance Required", "4 - Critical"], "impact": ["Downtime", "Performance", "Safety"], "inspection_status": ["Draft", "Complete", "Reviewed"]}};</script>
<script>
    // ========== DATA ==========
    let APP_DATA = null;
    let currentInspection = null;
    let editingInspectionId = null; // when set, start form is in edit-meta mode
    let currentSectionIndex = 0;
    let results = {}; // item_id -> {condition, notes, impacts, severity, photoDataUrl}
    let findings = [];

    // Load data
    async function loadData() {
      if (window.EMBEDDED_DATA && window.EMBEDDED_DATA.sections && window.EMBEDDED_DATA.sections.length) {
        APP_DATA = window.EMBEDDED_DATA;
      } else {
        try {
          const res = await fetch('inspection_data.json');
          APP_DATA = await res.json();
        } catch (e) {
          console.warn('Could not load data');
          APP_DATA = { sections: [], items: [], lists: {} };
        }
      }
      initApp();
    }

    // ========== STORAGE ==========
    function saveInspections(list) {
      localStorage.setItem('lx8_inspections', JSON.stringify(list));
    }
    function loadInspections() {
      try {
        return JSON.parse(localStorage.getItem('lx8_inspections') || '[]');
      } catch { return []; }
    }
    function saveCurrentDraft() {
      if (!currentInspection) return;
      currentInspection.results = results;
      currentInspection.findings = findings;
      currentInspection.currentSectionIndex = currentSectionIndex;
      currentInspection.updatedAt = new Date().toISOString();
      let list = loadInspections();
      const idx = list.findIndex(i => i.id === currentInspection.id);
      if (idx >= 0) list[idx] = currentInspection;
      else list.unshift(currentInspection);
      saveInspections(list);
    }

    // ========== UI HELPERS ==========
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      const bottom = document.getElementById('bottomBar');
      if (id === 'screenInspect') {
        bottom.classList.remove('hidden');
      } else {
        bottom.classList.add('hidden');
      }
      window.scrollTo(0, 0);
    }
    function toast(msg, ms = 2200) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), ms);
    }
    function setHeader(title) {
      // Logo is fixed; title change is optional / no-op for branded header
    }

    // ========== HOME ==========
    let searchQuery = '';

    function refreshHome() {
      let list = loadInspections();
      document.getElementById('statInspections').textContent = list.length;
      let openFindings = 0;
      list.forEach(ins => {
        if (ins.findings) openFindings += ins.findings.filter(f => f.status !== 'Closed').length;
      });
      document.getElementById('statFindings').textContent = openFindings;

      // Apply search filter
      const q = (searchQuery || '').trim().toLowerCase();
      if (q) {
        list = list.filter(ins => {
          const hay = [
            ins.customer, ins.serial, ins.technician, ins.model,
            ins.po, ins.date, ins.status
          ].map(x => (x || '').toLowerCase()).join(' ');
          return hay.includes(q);
        });
      }

      const container = document.getElementById('recentList');
      if (loadInspections().length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>No inspections yet.<br>Tap “New Inspection” to begin.</p></div>`;
        return;
      }
      if (list.length === 0) {
        container.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>No inspections match your search.</p></div>`;
        return;
      }
      container.innerHTML = list.slice(0, 30).map(ins => {
        const findCount = (ins.findings || []).length;
        const statusClass = ins.status === 'Complete' ? 'badge-complete' : 'badge-draft';
        return `
          <div class="list-item" data-id="${ins.id}">
            <div class="list-item-main" data-action="open">
              <div class="title">${ins.customer || 'Unknown'} – ${ins.serial || 'No S/N'}</div>
              <div class="sub">${ins.technician || ''} · ${ins.date || ''} · ${findCount} finding${findCount !== 1 ? 's' : ''}</div>
            </div>
            <div class="list-item-actions">
              <button class="btn-edit" data-action="edit" type="button">Edit</button>
              <span class="badge ${statusClass}">${ins.status || 'Draft'}</span>
            </div>
          </div>`;
      }).join('');
      container.querySelectorAll('.list-item').forEach(el => {
        const id = el.dataset.id;
        el.querySelector('[data-action="open"]').addEventListener('click', () => openInspection(id));
        el.querySelector('[data-action="edit"]').addEventListener('click', (e) => {
          e.stopPropagation();
          editInspectionMeta(id);
        });
      });
    }

    function openInspection(id) {
      const list = loadInspections();
      const ins = list.find(i => i.id === id);
      if (!ins) return;
      currentInspection = ins;
      results = ins.results || {};
      findings = ins.findings || [];
      currentSectionIndex = ins.currentSectionIndex || 0;
      if (ins.status === 'Complete') {
        showSummary();
      } else {
        renderSection();
        showScreen('screenInspect');
        setHeader('Inspecting');
      }
    }

    function editInspectionMeta(id) {
      const list = loadInspections();
      const ins = list.find(i => i.id === id);
      if (!ins) return;
      editingInspectionId = id;
      currentInspection = ins;
      // Prefill form
      document.getElementById('inpCustomer').value = ins.customer || '';
      document.getElementById('inpModel').value = ins.model || 'LX-8';
      document.getElementById('inpSerial').value = ins.serial || '';
      document.getElementById('inpTechnician').value = ins.technician || '';
      document.getElementById('inpDate').value = ins.date || new Date().toISOString().slice(0, 10);
      document.getElementById('inpPO').value = ins.po || '';
      // Autocomplete customers
      const customers = [...new Set(list.map(i => i.customer).filter(Boolean))];
      document.getElementById('customerList').innerHTML = customers.map(c => `<option value="${c}">`).join('');
      // Update button label
      const btn = document.getElementById('btnBeginInspection');
      btn.textContent = 'Save Changes';
      showScreen('screenStart');
      setHeader('Edit Inspection');
    }

    // ========== START ==========
    function initStartForm() {
      // Always start blank for a new inspection
      document.getElementById('inpCustomer').value = '';
      document.getElementById('inpModel').value = 'LX-8';
      document.getElementById('inpSerial').value = '';
      document.getElementById('inpTechnician').value = '';
      document.getElementById('inpDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('inpPO').value = '';
      // Autocomplete suggestions only (does not fill the fields)
      const list = loadInspections();
      const customers = [...new Set(list.map(i => i.customer).filter(Boolean))];
      document.getElementById('customerList').innerHTML = customers.map(c => `<option value="${c}">`).join('');
    }

    document.getElementById('btnNewInspection').addEventListener('click', () => {
      currentInspection = null;
      editingInspectionId = null;
      results = {};
      findings = [];
      currentSectionIndex = 0;
      initStartForm();
      document.getElementById('btnBeginInspection').textContent = 'Begin Inspection';
      showScreen('screenStart');
      setHeader('New Inspection');
    });

    document.getElementById('btnCancelStart').addEventListener('click', () => {
      editingInspectionId = null;
      document.getElementById('btnBeginInspection').textContent = 'Begin Inspection';
      showScreen('screenHome');
      setHeader('LX-8 Inspection');
      refreshHome();
    });

    document.getElementById('btnBeginInspection').addEventListener('click', () => {
      const customer = document.getElementById('inpCustomer').value.trim();
      const serial = document.getElementById('inpSerial').value.trim();
      const tech = document.getElementById('inpTechnician').value.trim();
      if (!customer || !serial || !tech) {
        toast('Please fill Customer, Serial # and Technician');
        return;
      }
      const model = document.getElementById('inpModel').value.trim() || 'LX-8';
      const date = document.getElementById('inpDate').value;
      const po = document.getElementById('inpPO').value.trim();

      // Edit existing inspection metadata
      if (editingInspectionId) {
        const list = loadInspections();
        const idx = list.findIndex(i => i.id === editingInspectionId);
        if (idx < 0) {
          toast('Inspection not found');
          return;
        }
        list[idx].customer = customer;
        list[idx].model = model;
        list[idx].serial = serial;
        list[idx].technician = tech;
        list[idx].date = date;
        list[idx].po = po;
        list[idx].updatedAt = new Date().toISOString();
        saveInspections(list);
        currentInspection = list[idx];
        editingInspectionId = null;
        document.getElementById('btnBeginInspection').textContent = 'Begin Inspection';
        toast('Inspection details updated');
        showScreen('screenHome');
        setHeader('LX-8 Inspection');
        refreshHome();
        return;
      }

      // Create new inspection
      currentInspection = {
        id: 'ins_' + Date.now(),
        customer,
        model,
        serial,
        technician: tech,
        date,
        po,
        status: 'Draft',
        results: {},
        findings: [],
        currentSectionIndex: 0,
        createdAt: new Date().toISOString()
      };
      results = {};
      findings = [];
      currentSectionIndex = 0;
      saveCurrentDraft();
      renderSection();
      showScreen('screenInspect');
      setHeader('Inspecting');
      toast('Inspection started');
    });

    // ========== INSPECTION ==========
    function getItemsForSection(sectionId) {
      return APP_DATA.items
        .filter(i => i.section_id === sectionId)
        .sort((a, b) => a.item_order_in_section - b.item_order_in_section);
    }

    function shortSectionName(name) {
      // Keep names readable but compact for the horizontal scroller
      const map = {
        'Spread Conveyor': 'Spread Conv.',
        'Accumulating Conveyor': 'Accum. Conv.',
        'Grouper Section': 'Grouper',
        'Slicing Conveyor': 'Slicing Conv.',
        'Band Slicer': 'Band Slicer',
        'Hinge Slicer': 'Hinge Slicer',
        'Bottom Slicer': 'Bottom Slicer',
        'Top Slicer': 'Top Slicer',
        'Cross-Over Conveyor': 'Cross-Over',
        'Bagger': 'Bagger',
        'Over Head Paddle Conveyor': 'Paddle Conv.',
        'Tying Conveyor': 'Tying Conv.'
      };
      return map[name] || name;
    }

    function renderSectionDots(scrollToCurrent) {
      const container = document.getElementById('sectionDots');
      container.innerHTML = APP_DATA.sections.map((s, idx) => {
        let cls = 'section-dot';
        if (idx < currentSectionIndex) cls += ' done';
        if (idx === currentSectionIndex) cls += ' current';
        // Check if section has findings
        const sectionItems = getItemsForSection(s.section_id);
        const hasFinding = sectionItems.some(it => {
          const r = results[it.item_id];
          return r && isBadResult(it, r.condition);
        });
        if (hasFinding) cls += ' has-findings';
        const label = shortSectionName(s.section);
        return `<div class="${cls}" data-idx="${idx}" title="${s.section}">${label}</div>`;
      }).join('');
      container.querySelectorAll('.section-dot').forEach(d => {
        d.addEventListener('click', () => {
          currentSectionIndex = parseInt(d.dataset.idx);
          renderSection(true); // true = allow scroll to top / section change
        });
      });
      // Only auto-scroll the dots bar when changing sections intentionally
      if (scrollToCurrent) {
        const current = container.querySelector('.section-dot.current');
        if (current) current.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    function isBadResult(item, value) {
      if (!value) return false;
      const bad = (item.photo_required_if || '').toLowerCase();
      return value.toLowerCase() === bad ||
        (item.inspection_type === 'Condition' && value === 'Damaged') ||
        (item.inspection_type === 'Functional' && value === 'Fail') ||
        (item.inspection_type === 'Measurement' && value === 'Out of Spec');
    }

    function renderSection(isSectionChange) {
      if (!APP_DATA) return;
      const section = APP_DATA.sections[currentSectionIndex];
      document.getElementById('sectionCounter').textContent = `Section ${currentSectionIndex + 1} of ${APP_DATA.sections.length}`;
      document.getElementById('sectionName').textContent = section.section;
      renderSectionDots(!!isSectionChange);

      const items = getItemsForSection(section.section_id);
      const answered = items.filter(i => results[i.item_id]?.condition).length;
      document.getElementById('itemProgress').textContent = `${answered} / ${items.length}`;

      const container = document.getElementById('itemsContainer');
      container.innerHTML = items.map(item => {
        const res = results[item.item_id] || {};
        const isAnswered = !!res.condition;
        const isFinding = isBadResult(item, res.condition);
        let cardClass = 'item-card';
        if (isAnswered) cardClass += ' answered';
        if (isFinding) cardClass += ' finding';

        const choices = (item.choices || '').split('|').filter(Boolean);
        const choiceHtml = choices.map(c => {
          const bad = isBadResult(item, c);
          const sel = res.condition === c ? 'selected' : '';
          return `<button class="choice-btn ${bad ? 'bad' : ''} ${sel}" data-item="${item.item_id}" data-value="${c}">${c}</button>`;
        }).join('');

        let findingHtml = '';
        if (isFinding) {
          const impacts = res.impacts || [];
          const impactBtns = (APP_DATA.lists.impact || ['Downtime','Performance','Safety']).map(imp => {
            const sel = impacts.includes(imp) ? 'selected' : '';
            return `<span class="impact-tag ${sel}" data-item="${item.item_id}" data-impact="${imp}">${imp}</span>`;
          }).join('');
          const sevs = APP_DATA.lists.severity || ['1 - Monitor','2 - Adjustment','3 - Maintenance Required','4 - Critical'];
          const sevOpts = sevs.map(s => {
            const val = s.charAt(0);
            const selected = (res.severity || item.severity_default || 2) == val ? 'selected' : '';
            return `<option value="${val}" ${selected}>${s}</option>`;
          }).join('');

          findingHtml = `
            <div class="finding-panel show">
              <div style="font-weight:600;margin-bottom:6px;color:var(--danger)">⚠️ Finding Details</div>
              <div class="form-group" style="margin-bottom:8px">
                <label>Impact</label>
                <div class="impact-tags">${impactBtns}</div>
              </div>
              <div class="form-group severity-select">
                <label>Severity</label>
                <select class="sev-select" data-item="${item.item_id}">${sevOpts}</select>
              </div>
              <div class="form-group">
                <label>Technician Notes</label>
                <textarea class="notes-input" data-item="${item.item_id}" placeholder="Describe the issue...">${res.notes || ''}</textarea>
              </div>
              <div class="photo-area ${res.photoDataUrl ? 'has-photo' : ''}" data-item="${item.item_id}">
                ${res.photoDataUrl
                  ? `<img class="photo-preview" src="${res.photoDataUrl}" alt="Photo" /><br><button class="photo-btn" data-item="${item.item_id}">Change Photo</button>`
                  : `<div>📷 Photo required</div><button class="photo-btn" data-item="${item.item_id}">Take / Choose Photo</button>`
                }
                <input type="file" accept="image/*" capture="environment" class="photo-input hidden" data-item="${item.item_id}" />
              </div>
            </div>`;
        }

        return `
          <div class="${cardClass}" id="item-${item.item_id}">
            <div class="item-title">${item.inspection_item}</div>
            <div class="item-type">${item.inspection_type}</div>
            <div class="choice-grid">${choiceHtml}</div>
            ${findingHtml}
          </div>`;
      }).join('');

      // Bind choice buttons
      container.querySelectorAll('.choice-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const itemId = parseInt(btn.dataset.item);
          const value = btn.dataset.value;
          if (!results[itemId]) results[itemId] = {};
          results[itemId].condition = value;
          // Auto-set default severity
          const item = APP_DATA.items.find(i => i.item_id === itemId);
          if (isBadResult(item, value) && !results[itemId].severity) {
            results[itemId].severity = item.severity_default || 2;
          }
          // Clear finding data if no longer bad
          if (!isBadResult(item, value)) {
            delete results[itemId].impacts;
            delete results[itemId].notes;
            delete results[itemId].photoDataUrl;
            delete results[itemId].severity;
          }
          updateFindings();
          saveCurrentDraft();
          // Preserve scroll position when re-rendering
          const scrollY = window.scrollY || window.pageYOffset;
          renderSection(false);
          // Restore after layout (double rAF is more reliable on mobile)
          requestAnimationFrame(() => {
            requestAnimationFrame(() => {
              window.scrollTo(0, scrollY);
            });
          });
        });
      });

      // Bind impact tags
      container.querySelectorAll('.impact-tag').forEach(tag => {
        tag.addEventListener('click', () => {
          const itemId = parseInt(tag.dataset.item);
          const impact = tag.dataset.impact;
          if (!results[itemId].impacts) results[itemId].impacts = [];
          const idx = results[itemId].impacts.indexOf(impact);
          if (idx >= 0) results[itemId].impacts.splice(idx, 1);
          else results[itemId].impacts.push(impact);
          updateFindings();
          saveCurrentDraft();
          tag.classList.toggle('selected');
        });
      });

      // Bind severity
      container.querySelectorAll('.sev-select').forEach(sel => {
        sel.addEventListener('change', () => {
          const itemId = parseInt(sel.dataset.item);
          results[itemId].severity = parseInt(sel.value);
          updateFindings();
          saveCurrentDraft();
        });
      });

      // Bind notes
      container.querySelectorAll('.notes-input').forEach(ta => {
        ta.addEventListener('input', () => {
          const itemId = parseInt(ta.dataset.item);
          results[itemId].notes = ta.value;
          updateFindings();
          saveCurrentDraft();
        });
      });

      // Bind photo
      container.querySelectorAll('.photo-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const itemId = btn.dataset.item;
          const input = container.querySelector(`.photo-input[data-item="${itemId}"]`);
          if (input) input.click();
        });
      });
      container.querySelectorAll('.photo-input').forEach(inp => {
        inp.addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const itemId = parseInt(inp.dataset.item);
          const reader = new FileReader();
          reader.onload = (ev) => {
            results[itemId].photoDataUrl = ev.target.result;
            updateFindings();
            saveCurrentDraft();
            const scrollY = window.scrollY || window.pageYOffset;
            renderSection(false);
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                window.scrollTo(0, scrollY);
              });
            });
            toast('Photo attached');
          };
          reader.readAsDataURL(file);
        });
      });

      // Update next button text
      const isLast = currentSectionIndex === APP_DATA.sections.length - 1;
      document.getElementById('btnNextSection').textContent = isLast ? 'Review →' : 'Next →';
      document.getElementById('btnPrevSection').style.visibility = currentSectionIndex === 0 ? 'hidden' : 'visible';
    }

    function updateFindings() {
      findings = [];
      Object.keys(results).forEach(idStr => {
        const itemId = parseInt(idStr);
        const item = APP_DATA.items.find(i => i.item_id === itemId);
        if (!item) return;
        const r = results[itemId];
        if (isBadResult(item, r.condition)) {
          findings.push({
            item_id: itemId,
            section: item.section,
            item_name: item.inspection_item,
            condition: r.condition,
            severity: r.severity || item.severity_default || 2,
            impacts: r.impacts || [],
            notes: r.notes || '',
            photoDataUrl: r.photoDataUrl || null,
            ai_category: item.ai_finding_category,
            status: 'Open'
          });
        }
      });
    }

    document.getElementById('btnNextSection').addEventListener('click', () => {
      if (currentSectionIndex < APP_DATA.sections.length - 1) {
        currentSectionIndex++;
        saveCurrentDraft();
        renderSection(true);
        window.scrollTo(0, 0);
      } else {
        updateFindings();
        saveCurrentDraft();
        showSummary();
      }
    });

    document.getElementById('btnPrevSection').addEventListener('click', () => {
      if (currentSectionIndex > 0) {
        currentSectionIndex--;
        saveCurrentDraft();
        renderSection(true);
        window.scrollTo(0, 0);
      }
    });

    // ========== SUMMARY ==========
    function showSummary() {
      updateFindings();
      const totalAnswered = Object.keys(results).length;
      document.getElementById('sumTotalItems').textContent = totalAnswered;
      document.getElementById('sumFindings').textContent = findings.length;

      document.getElementById('summaryMeta').innerHTML = `
        <strong>${currentInspection.customer}</strong><br>
        ${currentInspection.model} · S/N ${currentInspection.serial}<br>
        Tech: ${currentInspection.technician} · ${currentInspection.date}
        ${currentInspection.po ? ' · PO ' + currentInspection.po : ''}
      `;

      const listEl = document.getElementById('findingsList');
      if (findings.length === 0) {
        listEl.innerHTML = `<div class="empty-state" style="padding:20px"><p>No findings – all items passed 🎉</p></div>`;
      } else {
        listEl.innerHTML = findings
          .sort((a, b) => b.severity - a.severity)
          .map(f => `
            <div class="finding-summary-card">
              <div style="font-weight:600">${f.item_name}</div>
              <div style="font-size:0.85rem;color:var(--muted)">${f.section}</div>
              <div class="sev">Severity ${f.severity} · ${f.condition}</div>
              ${f.impacts.length ? `<div style="font-size:0.8rem;margin-top:4px">Impact: ${f.impacts.join(', ')}</div>` : ''}
              ${f.notes ? `<div style="font-size:0.9rem;margin-top:6px">${f.notes}</div>` : ''}
              ${f.photoDataUrl ? `<img src="${f.photoDataUrl}" class="photo-preview" style="margin-top:8px" />` : ''}
            </div>
          `).join('');
      }

      showScreen('screenSummary');
      setHeader('Review & Complete');
    }

    document.getElementById('btnBackToInspect').addEventListener('click', () => {
      renderSection();
      showScreen('screenInspect');
      setHeader('Inspecting');
    });

    document.getElementById('btnComplete').addEventListener('click', () => {
      currentInspection.status = 'Complete';
      currentInspection.overallCondition = document.getElementById('overallCondition').value;
      currentInspection.summaryNotes = document.getElementById('summaryNotes').value;
      currentInspection.completedAt = new Date().toISOString();
      currentInspection.findings = findings;
      currentInspection.results = results;
      saveCurrentDraft();
      toast('Inspection completed ✓');
      setTimeout(() => {
        showScreen('screenHome');
        setHeader('LX-8 Inspection');
        refreshHome();
      }, 800);
    });

    // ========== PDF REPORT ==========
    function generatePDFReport() {
      if (!currentInspection) {
        toast('No inspection data');
        return;
      }
      if (typeof window.jspdf === 'undefined') {
        toast('PDF library still loading… try again in a moment');
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'letter' });
      const pageWidth = doc.internal.pageSize.getWidth();
      const margin = 16;
      let y = 18;

      // Header bar
      doc.setFillColor(26, 54, 93);
      doc.rect(0, 0, pageWidth, 28, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(16);
      doc.setFont('helvetica', 'bold');
      doc.text('LeMatic LX-8 Inspection Report', margin, 14);
      doc.setFontSize(9);
      doc.setFont('helvetica', 'normal');
      doc.text('Baking Equipment Inspection  •  Automation for Bakery', margin, 21);

      y = 38;
      doc.setTextColor(26, 32, 44);

      // Meta info
      const meta = [
        ['Customer / Plant', currentInspection.customer || '—'],
        ['Machine Model', currentInspection.model || 'LX-8'],
        ['Serial Number', currentInspection.serial || '—'],
        ['Technician', currentInspection.technician || '—'],
        ['Inspection Date', currentInspection.date || '—'],
        ['PO Number', currentInspection.po || '—'],
        ['Status', currentInspection.status || 'Draft'],
        ['Overall Condition', document.getElementById('overallCondition')?.value || currentInspection.overallCondition || '—']
      ];

      doc.setFontSize(10);
      doc.setFont('helvetica', 'bold');
      doc.text('Inspection Details', margin, y);
      y += 6;

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      meta.forEach(([label, value]) => {
        doc.setTextColor(113, 128, 150);
        doc.text(label + ':', margin, y);
        doc.setTextColor(26, 32, 44);
        doc.text(String(value), margin + 42, y);
        y += 5.5;
      });

      y += 4;
      // Summary notes
      const notes = document.getElementById('summaryNotes')?.value || currentInspection.summaryNotes || '';
      if (notes.trim()) {
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(10);
        doc.setTextColor(26, 32, 44);
        doc.text('Summary Notes', margin, y);
        y += 5;
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        const splitNotes = doc.splitTextToSize(notes, pageWidth - margin * 2);
        doc.text(splitNotes, margin, y);
        y += splitNotes.length * 4.5 + 4;
      }

      // Findings section
      updateFindings();
      doc.setFont('helvetica', 'bold');
      doc.setFontSize(10);
      doc.setTextColor(26, 32, 44);
      doc.text(`Findings (${findings.length})`, margin, y);
      y += 6;

      if (findings.length === 0) {
        doc.setFont('helvetica', 'normal');
        doc.setFontSize(9);
        doc.setTextColor(56, 161, 105);
        doc.text('No findings — all inspected items passed.', margin, y);
        y += 8;
      } else {
        // Table of findings
        const tableData = findings
          .sort((a, b) => b.severity - a.severity)
          .map(f => [
            f.section || '',
            f.item_name || '',
            f.condition || '',
            String(f.severity || ''),
            (f.impacts || []).join(', ') || '—',
            (f.notes || '').substring(0, 80) + ((f.notes || '').length > 80 ? '…' : '')
          ]);

        doc.autoTable({
          startY: y,
          head: [['Section', 'Item', 'Condition', 'Sev', 'Impact', 'Notes']],
          body: tableData,
          margin: { left: margin, right: margin },
          styles: {
            fontSize: 7.5,
            cellPadding: 2.5,
            overflow: 'linebreak',
            valign: 'top'
          },
          headStyles: {
            fillColor: [26, 54, 93],
            textColor: 255,
            fontStyle: 'bold',
            fontSize: 8
          },
          columnStyles: {
            0: { cellWidth: 28 },
            1: { cellWidth: 38 },
            2: { cellWidth: 22 },
            3: { cellWidth: 12 },
            4: { cellWidth: 28 },
            5: { cellWidth: 'auto' }
          },
          didParseCell: function(data) {
            if (data.section === 'body' && data.column.index === 3) {
              const sev = parseInt(data.cell.raw);
              if (sev >= 4) data.cell.styles.textColor = [197, 48, 48];
              else if (sev >= 3) data.cell.styles.textColor = [214, 158, 46];
            }
          }
        });
        y = doc.lastAutoTable.finalY + 8;
      }

      // Items checked summary
      const totalItems = APP_DATA?.items?.length || 136;
      const answered = Object.keys(results).length;
      doc.setFont('helvetica', 'normal');
      doc.setFontSize(8);
      doc.setTextColor(113, 128, 150);
      if (y > 250) {
        doc.addPage();
        y = 20;
      }
      doc.text(`Items recorded: ${answered} of ${totalItems}  |  Generated: ${new Date().toLocaleString()}`, margin, y);

      // Footer on every page
      const pageCount = doc.internal.getNumberOfPages();
      for (let i = 1; i <= pageCount; i++) {
        doc.setPage(i);
        doc.setFontSize(7);
        doc.setTextColor(160, 174, 192);
        doc.text(`LeMatic LX-8 Inspection Report  •  Page ${i} of ${pageCount}`, margin, 272);
        doc.text(currentInspection.serial || '', pageWidth - margin - 30, 272);
      }

      // Filename
      const safeName = (currentInspection.customer || 'Inspection')
        .replace(/[^a-z0-9]/gi, '_')
        .substring(0, 30);
      const filename = `LX8_Inspection_${safeName}_${currentInspection.date || 'report'}.pdf`;

      doc.save(filename);
      toast('PDF report downloaded');
    }

    document.getElementById('btnGeneratePDF').addEventListener('click', generatePDFReport);

    // ========== NAV ==========
    document.getElementById('btnHome').addEventListener('click', () => {
      if (currentInspection && currentInspection.status !== 'Complete') {
        saveCurrentDraft();
      }
      // Close search when going home
      document.getElementById('searchBar').classList.remove('show');
      showScreen('screenHome');
      setHeader('LX-8 Inspection');
      refreshHome();
    });

    document.getElementById('btnSearch').addEventListener('click', () => {
      const bar = document.getElementById('searchBar');
      const isOpen = bar.classList.toggle('show');
      if (isOpen) {
        // Go to home so search results are visible
        if (document.querySelector('.screen.active')?.id !== 'screenHome') {
          if (currentInspection && currentInspection.status !== 'Complete') {
            saveCurrentDraft();
          }
          showScreen('screenHome');
          setHeader('LX-8 Inspection');
        }
        const inp = document.getElementById('inpSearch');
        inp.focus();
        // Move cursor to end
        const v = inp.value;
        inp.value = '';
        inp.value = v;
      } else {
        // Optional: clear filter when closing
        // searchQuery = '';
        // document.getElementById('inpSearch').value = '';
        // refreshHome();
      }
    });

    document.getElementById('inpSearch').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      refreshHome();
    });

    // ========== INIT ==========
    function initApp() {
      refreshHome();
      // Prevent zoom on double-tap etc.
      document.addEventListener('gesturestart', e => e.preventDefault());
    }

    // Start
    loadData();

    // Register service worker (PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('Service worker registration failed:', err);
        });
      });
    }

    </script>
</body>
</html>
